services:

* type: web
  name: texverse-api
  runtime: python

  rootDir: backend

  buildCommand: pip install -r requirements.txt

  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

  envVars:

  * key: DATABASE_URL
    sync: false

  * key: SECRET_KEY
    generateValue: true

  * key: FRONTEND_ORIGINS
    sync: false

  * key: TEXVERSE_AUTO_CATALOG_IMPORT
    value: "true"
